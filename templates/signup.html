<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | Papertrail</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand auth-brand" href="{{ url_for('login') }}"><span class="brand-mark">P</span><span>Papertrail</span></a>
        <p class="eyebrow">A calmer way to read</p>
        <h1>Create your space.</h1>
        <p class="auth-intro">Save your documents and keep every question close.</p>
        {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
        <form class="auth-form" method="POST">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="password">Password <span class="field-note">6+ characters</span></label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
            <button type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </main>
</body>
</html>
